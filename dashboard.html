    def __init__(
        self,
        dotenv_path: Optional[str] = None,
        stream=None,
        verbose: bool = False,
        encoding: Optional[str] = None,
        interpolate: bool = True,
        override: bool = True,
    ) -> None:
        self.dotenv_path = dotenv_path
        self.stream = stream
        self._dict: Optional[Dict] = None
        self.verbose = verbose
        self.encoding = encoding
        self.interpolate = interpolate
        self.override = override

    def dict(self) -> Dict[str, Optional[str]]:
        """Parse the .env file and return key-value pairs as dict."""
        if self._dict:
            return self._dict
        raw_values = self.parse()
        # resolve variable interpolation: KEY=\${OTHER_KEY}
        if self.interpolate:
            self._dict = resolve_variables(raw_values, override=self.override)
        else:
            self._dict = OrderedDict(raw_values)
        return self._dict

def load_dotenv(
    dotenv_path=None,
    stream=None,
    verbose=False,
    override=True,
    interpolate=True,
    encoding="utf-8",
) -> bool:
    """Load .env file into os.environ. Returns True if file was found."""
    f = dotenv_path or find_dotenv()
    return DotEnv(
        f, stream=stream, verbose=verbose,
        override=override, interpolate=interpolate,
        encoding=encoding,
    ).set_as_environment_variables()`,
};

      )}

      {/* Log entries */}
      <div className="log-scroll flex-1 overflow-y-auto px-4 pt-3">
        {logs.length === 0 ? (
          <div className="flex flex-col items-center justify-center h-full text-center select-none">
            <div className="text-5xl mb-3" style={{ opacity: .1 }}>◈</div>
            <div className="text-[11px]" style={{ color: '#2a3a50' }}>No execution trace yet.</div>
            <div className="text-[10px] mt-1" style={{ color: '#1a2540' }}>Click "Simulate Flow" or upload a PDF.</div>
          </div>
        ) : (
          logs.map((s, i) => <LogEntry key={i} step={s} />)
        )}
        <div ref={bottomRef} />
      </div>

      {/* Footer */}
      <div className="px-4 py-2 flex items-center justify-between border-t" style={{ borderColor: '#111928', background: '#090d18' }}>
        <div className="flex items-center gap-2">
          <Dot on={simulating} />
          <span className="text-[9px]" style={{ color: '#3a4a5c' }}>{simulating ? 'EXECUTING…' : 'READY'}</span>
        </div>
        {logs.length > 0 && (
          <button onClick={onClear} className="text-[9px] transition-colors" style={{ color: '#2a3a50', background: 'none', border: 'none', cursor: 'pointer' }}
            onMouseEnter={e => e.currentTarget.style.color = '#3a4a5c'}
            onMouseLeave={e => e.currentTarget.style.color = '#2a3a50'}>
            CLEAR TRACE
          </button>
        )}
      </div>
    </div>
  );
};

/* ─── ROOT APP ─── */
const App = () => {
  const [activeFile, setActiveFile] = useState('soul.md');
  const [messages,   setMessages]   = useState(INITIAL_MSGS);
  const [logs,       setLogs]       = useState([]);
  const [simulating, setSimulating] = useState(false);
  const [hasPdf,     setHasPdf]     = useState(false);

  const ts = () => new Date().toLocaleTimeString('en-US', { hour12: false });

  const appendLog = useCallback((step) => {
    setLogs(prev => [...prev, { ...step, ts: ts() }]);
  }, []);

  const runFlow = useCallback(async (steps, delay = 700) => {
    for (let i = 0; i < steps.length; i++) {
      await new Promise(r => setTimeout(r, i === 0 ? 300 : delay));
      appendLog(steps[i]);
    }
  }, [appendLog]);

  const simulate = useCallback(async () => {
    if (simulating) return;
    setSimulating(true);
    setLogs([]);
    setHasPdf(true);
    setMessages([
      ...INITIAL_MSGS,
      { role: 'system', text: '⟳ Simulation started — running mock execution flow…', ts: ts() },
    ]);

    await runFlow(FLOW_STEPS, 750);

    await new Promise(r => setTimeout(r, 400));
    setMessages([...INITIAL_MSGS, getRandomOpening()]);
    setSimulating(false);
  }, [simulating, runFlow]);

  const handleSend = useCallback(async (text) => {
    setMessages(prev => [...prev, { role: 'user', text, ts: ts() }]);

    const msgSteps = [
      { type: 'trigger', label: '[Trigger]', icon: '→', color: '#f5a623',
        msg: `User sent: "${text.length > 45 ? text.slice(0, 45) + '…' : text}"`,
        detail: `${text.length} chars input` },
      ...FLOW_STEPS.slice(2),
    ];

    for (let i = 0; i < msgSteps.length; i++) {
      await new Promise(r => setTimeout(r, (i + 1) * 550));
      appendLog(msgSteps[i]);
    }

    await new Promise(r => setTimeout(r, 700));
    setMessages(prev => [...prev, {
      role: 'agent',
      text: 'תשובה טובה ✓\n\nנכון לגבי השימוש ב-whitelist. נוסיף:\n\n• **Mongoose Schema Validation** — האכיפה ברמת ה-schema מונעת הזרקת שדות לא צפויים.\n• **$where / eval() — אסור** בכל מצב. גם מפני ביצועים וגם מפני security.\n\n---\n\n**השאלה:** איך היית מממש rate limiting ב-Express למניעת brute force על endpoint של login?',
      ts: ts(),
    }]);
  }, [appendLog]);

  const handleUpload = useCallback(async (file) => {
    setHasPdf(true);
    setMessages(prev => [...prev, {
      role: 'system',
      text: `📎 Uploaded: ${file.name} (${(file.size / 1024).toFixed(1)} KB) — extracting text…`,
      ts: ts(),
    }]);
    await simulate();
  }, [simulate]);

  const handleHint = useCallback(async () => {
    setMessages(prev => [...prev, { role: 'user', text: 'רמז', ts: ts() }]);
    appendLog({ ...FLOW_STEPS[4], msg: 'Hint requested → sending to Groq with רמז trigger', ts: ts() });
    await new Promise(r => setTimeout(r, 900));
    setMessages(prev => [...prev, { role: 'agent', text: '💡 חשוב על Middleware ב-Express…', ts: ts() }]);
  }, [appendLog]);

  const handleSkip = useCallback(async () => {
    setMessages(prev => [...prev, { role: 'user', text: 'דלג ⏭️', ts: ts() }]);
    appendLog({ ...FLOW_STEPS[3], msg: 'Skip trigger → memory_rules.md SKIP flow activated', ts: ts() });
    appendLog({ ...FLOW_STEPS[4], msg: 'Sending skip payload → Groq', detail: 'Will generate explanation + new question', ts: ts() });
    await new Promise(r => setTimeout(r, 1000));
    setMessages(prev => [...prev, {
      role: 'agent',
      text: 'בסדר, נעבור הלאה.\n\n**תשובה מלאה:** Rate limiting ב-Express מממשים עם `express-rate-limit`. מגדירים `windowMs` ו-`max` לפי endpoint. מומלץ גם להוסיף `slowDown` לחסימה הדרגתית לפני ה-block המלא.\n\n---\n\n**השאלה:** מה ההבדל בין SQL Injection ל-NoSQL Injection, ואיך מתגוננים מכל אחד?',
      ts: ts(),
    }]);
  }, [appendLog]);

  return (
    <div className="app-root h-screen flex flex-col overflow-hidden grid-bg" style={{ background: '#06080e' }}>

      {/* Top nav */}
      <header className="app-header flex items-center justify-between px-5 py-2.5 border-b flex-shrink-0" style={{ borderColor: '#1a2540', background: '#090d18' }}>
        <div className="flex items-center gap-4">
          <div className="flex items-center gap-2">
            <div className="w-2 h-2 rounded-full pulse" style={{ background: '#00d4a0', color: '#00d4a0' }} />
            <span className="text-sm font-bold tracking-widest" style={{ color: '#cdd9ea' }}>AGENT//OS</span>
            <span style={{ color: '#1a2540' }}>|</span>
            <span className="text-xs" style={{ color: '#3a4a5c' }}>Debug Console</span>
          </div>
          <span className="text-[9px] px-2 py-0.5 rounded" style={{ background: '#1a2540', color: '#3a4a5c' }}>v1.0.0</span>
        </div>

        <div className="app-header-status flex items-center gap-6 text-[9.5px]">
          {[
            { on: true,   color: '#4ade80', label: 'Groq API' },
            { on: true,   color: '#4d9fff', label: 'llama-3.1-8b-instant' },
            { on: hasPdf, color: '#a78bfa', label: 'PDF Context' },
          ].map(({ on, color, label }) => (
            <div key={label} className="flex items-center gap-1.5">
              <Dot on={on} color={color} />
              <span style={{ color: '#3a4a5c' }}>{label}</span>
            </div>
          ))}
        </div>
      </header>

      {/* Three-panel grid */}
      <main className="app-main flex-1 grid gap-3 p-3 overflow-hidden" style={{ gridTemplateColumns: '1.9fr 1.15fr 0.85fr' }}>
        <BrainPanel active={activeFile} setActive={setActiveFile} hasPdf={hasPdf} />
        <ChatPanel
          messages={messages}
          onSend={handleSend}
          onHint={handleHint}
          onSkip={handleSkip}
          onUpload={handleUpload}
          hasPdf={hasPdf}
        />
        <LogPanel
          logs={logs}
          simulating={simulating}
          onSimulate={simulate}
          onClear={() => setLogs([])}
        />
      </main>

      {/* Status bar */}
      <footer className="flex items-center justify-between px-5 py-1 border-t flex-shrink-0" style={{ borderColor: '#111928', background: '#070a10' }}>
        <div className="flex gap-5 text-[9px]" style={{ color: '#2a3a50' }}>
          <span>agent_config/soul.md · skills.md · memory_rules.md</span>
          <span>tools/pdf_handler.py (pypdf)</span>
          <span>main.py · Telegram Bot</span>
        </div>
        <div className="flex gap-5 text-[9px]" style={{ color: '#2a3a50' }}>
          <span>Window: last 6 msgs</span>
          <span>Temp: 0.6</span>
          <span>Max tokens: 800</span>
          <span>Model: llama-3.1-8b-instant</span>
        </div>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
